midly={version="0.5.3",default-features=false,features=["std"]}
wasm-bindgen="=0.2.127"
wasm-bindgen-futures="=0.4.77"
js-sys="=0.3.104"
web-sys={version="=0.3.104",features=["File","FileList","DragEvent","DataTransfer","Storage","Window","Document","Element","HtmlElement","HtmlInputElement","HtmlSelectElement","HtmlCanvasElement","CanvasRenderingContext2d","Event","EventTarget","KeyboardEvent","PointerEvent","WheelEvent","DomTokenList","Node","MessageChannel","MessageEvent","Worker","WorkerOptions","WorkerType","DedicatedWorkerGlobalScope","Response","Performance","AudioContext","AudioContextOptions","AudioWorklet","AudioWorkletNode","AudioWorkletNodeOptions","AudioNode","AudioDestinationNode","AudioParam","GainNode","OscillatorNode","MessagePort","Navigator","MediaDevices","MediaStream","MediaStreamConstraints","MediaStreamAudioSourceNode","MediaStreamTrack","Blob","BlobPropertyBag","Url","console"]}
[profile.release]
