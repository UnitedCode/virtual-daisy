[package]
name = "virtual-daisy-web"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[features]
default=["lab"]
lab=[]
profile=[]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name="profile"
required-features=["profile"]

[dependencies]
virtual-daisy = { path = "../.." }
zmu_cortex_m = { path = "../cpu", default-features = false, features = ["armv7em", "fpv5-d16"] }
wasm-bindgen = "=0.2.127"
sha2 = "0.10.9"

[build-dependencies]
zmu_cortex_m = { path="../cpu", default-features=false, features=["armv7em","fpv5-d16"] }
sha2 = "0.10.9"

[target.'cfg(target_arch="wasm32")'.dependencies]
wasm-bindgen-futures = "=0.4.77"
js-sys = "=0.3.104"
web-sys = { version="=0.3.104", features=["Window","Document","Element","HtmlElement","Event","EventTarget","Response","HtmlCanvasElement","CanvasRenderingContext2d","Blob","BlobPropertyBag","Url","Performance","HtmlAnchorElement","console"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
