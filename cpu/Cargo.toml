# Modified for Virtual Daisy's browser backend; see UPSTREAM.md.
[package]
name = "zmu_cortex_m"
version = "0.1.16"
authors = ["Jarmo Torvinen <jarmo.torvinen@iki.fi>"]
edition = "2024"
license = "Apache-2.0"

[workspace]

[profile.release]
opt-level=3
lto="thin"
codegen-units=1

[dependencies]
byteorder = "1.5"
enum-set = "0.0.8"
gdbstub = "0.7.8"
gdbstub_arch = "0.3.2"
log = "0.4.28"
num-bigfloat = { version = "1.7.2", default-features = false, features = ['num-traits'] }
rustc_apfloat = "=0.2.3"
thiserror = "2.0.17"


[features]
default = ["armv7m"]
has-fp = []
vfp-register-bank-d16 = []
fpv4-sp-d16 = ["has-fp", "vfp-register-bank-d16"]
fpv5-sp-d16 = ["has-fp", "vfp-register-bank-d16"]
fpv5-d16 = ["has-fp", "vfp-register-bank-d16"]
# Additive DSP extension capability (Armv7E-M = Armv7-M + DSP extension).
has-dsp-ext = []
armv6m = []
armv7m = []
armv7em = ["has-dsp-ext"]
