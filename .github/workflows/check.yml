name: Rust checks

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
          targets: thumbv7em-none-eabihf
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo rustc --locked --lib --crate-type cdylib
      - run: cargo test --locked --test arm_guests -- --ignored
      - run: cargo test --locked --manifest-path cpu/Cargo.toml --no-default-features --features armv7em,fpv5-d16
      - run: cargo check --locked --no-default-features --lib
  cpu-profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        features: ["armv7em", "armv7em,fpv4-sp-d16", "armv7em,fpv5-sp-d16"]
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked --manifest-path cpu/Cargo.toml --no-default-features --features "${{ matrix.features }}"
  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - run: cargo check --locked --target wasm32-unknown-unknown --lib
